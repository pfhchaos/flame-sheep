[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-sheep"
version = "0.1.0"
description = "Audio-reactive flame fractal wallpaper — Electric Sheep reimagined"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "moderngl>=5.12.0",
    "numpy>=2.0",
    "scipy>=1.16",
    "Pillow",
    "cffi",
    "glcontext",
    "pywayland",
    "dbus-python",
    "PyGObject",
    "vulkan",
    "platformdirs",
    "flame-sheep-audio",
    "wallpaper-ml",
    "viz-authoring",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
eval = ["musdb>=0.4"]
# Optional ML genome-scoring backends — torch CNN scorer + scikit-image
# experimental metrics; both guarded, the daemon runs without them.
scoring = ["torch", "scikit-image"]

[project.scripts]
flame-sheep = "flame_sheep.main:main"

[tool.setuptools.packages.find]
where = ["."]
# Allowlist, not an exclude-list: only flame_sheep (+ its subpackages) ships.
# The flat repo root also holds evals/ (has __init__.py), tests/, tools/,
# datasets/, docs/ — an exclude-list leaks whatever it forgets (evals/ was
# being swept into the wheel). An include allowlist can't. The sibling
# package project-dirs (flame_sheep_audio/ etc.) are separate distributions,
# not part of this one.
include = ["flame_sheep", "flame_sheep.*"]

[tool.setuptools.package-data]
# Ship the GPU shaders and the example config in built wheels — without this
# they're dropped from a non-editable build (everything works today only
# because the dev installs are editable and read the source tree).
flame_sheep = [
    "rendering/shaders/*",
    "rendering/vk/shaders/*",
    "default_config.toml",
    # Canonical compare-mode CNN scorer weights. Explicit filename, NOT a
    # glob: the data dir also holds untracked personal/backup variants that
    # must not sweep into the wheel.
    "data/cnn_scorer_vk.npy",
]

[tool.pytest.ini_options]
testpaths = ["tests", "flame_sheep_audio/tests", "viz_authoring/tests"]
# --import-mode=importlib: don't auto-prepend test directories to sys.path.
# Prevents the silent-shadowing class where tests/wallpaper_ml/__init__.py
# would mask the installed wallpaper_ml package and cause every numerical-
# correctness test to skip with no error signal. See tests/conftest.py for
# the runtime verification that backs this up.
addopts = "--tb=short -m 'not slow' --import-mode=importlib --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
